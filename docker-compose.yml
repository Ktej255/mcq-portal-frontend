
services:
  db:
    image: postgres:15-alpine
    container_name: mcq_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Local development only; override with a .env next to this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: mcq_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: mcq_backend
    restart: always
    ports:
      - "8000:8080"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
